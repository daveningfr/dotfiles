# Config for the Quickshell bar's audio visualiser.
#
# Keys only take effect in the section they belong to. An option placed in the
# wrong section is ignored without warning, which is easy to miss: the previous
# version of this file had method/source/noise_reduction/monstercat/waves under
# [general] and stereo/reverse under [general] rather than [output], so cava
# silently used its defaults (notably noise_reduction = 77, its slowest).

[general]
# Display rate for the bars. Consumed frames are rendered 1:1 by lib/Cava.qml.
framerate = 30

# Must match Theme.cavaBarCount, otherwise cava produces values the bar discards.
bars = 12

# 0 = off, 1 = normal, 2+ = adapts more aggressively.
autosens = 1

lower_cutoff_freq = 50
higher_cutoff_freq = 10000

[input]
method = pulse
source = auto

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
# lib/Cava.qml maps digits 0-7 onto eight block glyphs, so the range must be 7.
ascii_max_range = 7
bar_delimiter = 0
channels = stereo
reverse = 0

[smoothing]
monstercat = 0
waves = 0
# 0-100, where 100 is very slow and smooth and 0 is fast but noisy. The default
# of 77 left the bars parked near the top; 30 lets them rise and fall with the
# music instead of sitting still.
noise_reduction = 30
