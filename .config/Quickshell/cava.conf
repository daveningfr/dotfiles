[general]
bars = 14
framerate = 30
autosens = 1
lower_cutoff_freq = 50
higher_cutoff_freq = 10000
method = pulse
source = auto
stereo = true
reverse = false
monstercat = false
waves = false
noise_reduction = 0.17
input_delay = 2

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 7
bar_delimiter = 0
