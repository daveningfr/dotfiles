general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
}

listener {
    timeout = 600
    # Go through loginctl so lock_cmd's `pidof hyprlock ||` guard applies and
    # repeated idle timeouts cannot stack more hyprlock processes.
    on-timeout = loginctl lock-session
}

listener {
    timeout = 1800
    on-timeout = systemctl suspend
}
