source = ~/.cache/wal/colors-hyprland.conf

$WALLPAPER = ~/.config/hypr/hyprlock/wallpaper

background {
    path = $WALLPAPER
    blur_passes = 3
}

input-field {
    monitor = 
    size = 170,45
    outline_thickness = 2
    dots_size = 0.2
    dots_center = true
    outer_color = rgba(0,0,0,0)
    inner_color = $color0
    font_color = $foreground
    fade_on_empty = false
    font_family = 0xProto Nerd Font Mono
    placeholder_text = Enter Password
    hide_input = false
    position = 0, -425
    halign = center
    valign = center
}

#Lock
label{
    text = 
    color = $foreground
    font_size = 36
    font_family = 0xProto Nerd Font Mono
    position = 0,460
    halign = center
    valign = center
}
#Time
label{
    text = cmd[update:1000] date '+%H:%M'
    color = $foreground
    font_size = 85
    font_family = 0xProto Nerd Font Mono
    position = 0,310
    halign = center
    valign = center
}

#Date
label{
    text = cmd[update:1000] date '+%A, %B %d'
    color = $foreground
    font_size = 30
    font_family = 0xProto Nerd Font Mono
    position = 0,400
    halign = center
    valign = center
}

#User
label{
    text = $USER
    color = $foreground
    font_size = 20
    font_family = 0xProto Nerd Font Mono
    position = 0,-360
    halign = center
    valign = center
}

#Spotify
label{
    text = cmd[update:1000] echo "$(~/.config/hypr/hyprlock/scripts/spotify-playing.sh)"
    color = $foreground
    font_size = 13
    font_family = 0xProto Nerd Font Mono
    position = 0,-310
    halign = center
    valign = center
}

#Battery
label{
    text = cmd[update:10000] ~/.config/hypr/hyprlock/scripts/battery-status.sh
    color = $foreground
    font_size = 18
    font_family = 0xProto Nerd Font Mono
    position = -30,30
    halign = right
    valign = bottom
}
